[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.34.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "msi"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = ["$XDG_BIN_HOME/", "$XDG_DATA_HOME/../bin", "~/.local/bin"]
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# The MSI definition (crates/app/wix/main.wxs) is customised (Start menu
# shortcuts, licenses), so dist must not regenerate it.
allow-dirty = ["msi"]
# Build all artifacts on pull requests (without publishing) to check them.
pr-run-mode = "upload"
# Whether to enable GitHub Attestations
github-attestations = true
# Extra static files to include in each App (path relative to this Cargo.toml's dir)
include = ["crates/render/assets/fonts/Inter-LICENSE.txt", "crates/render/assets/fonts/JetBrainsMono-LICENSE.txt", "docs/configuration.md", "docs/skins.md"]

[dist.github-custom-runners]
# Build ARM64 Linux natively instead of cross-compiling
aarch64-unknown-linux-gnu = "ubuntu-24.04-arm"
